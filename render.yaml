# Render blueprint for Tamis (decision D-17). Services: PostgreSQL, API, worker, web.
# PDFs: set S3_BUCKET / S3_ENDPOINT_URL (Cloudflare R2, Backblaze B2…) so that the API
# needs no persistent disk and can scale; otherwise attach a disk to the API at /data.
databases:
  - name: tamis-db
    plan: basic-256mb
    databaseName: tamis
    user: tamis

services:
  - type: web
    name: tamis-api
    runtime: docker
    dockerfilePath: apps/api/Dockerfile
    dockerContext: .
    plan: starter
    region: frankfurt
    healthCheckPath: /health
    envVars:
      - key: TAMIS_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase: { name: tamis-db, property: connectionString }
      - key: SECRET_KEY
        generateValue: true
      - key: BASE_URL
        value: https://tamis.app
      - key: CORS_ORIGINS
        value: https://tamis.app
      - key: COOKIE_SECURE
        value: "true"
      - key: INLINE_JOBS
        value: "0"
      - key: EMAIL_PROVIDER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: UNPAYWALL_EMAIL
        sync: false

  - type: worker
    name: tamis-worker
    runtime: docker
    dockerfilePath: apps/api/Dockerfile
    dockerContext: .
    dockerCommand: python -m tamis_api.worker
    plan: starter
    region: frankfurt
    envVars:
      - key: TAMIS_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase: { name: tamis-db, property: connectionString }
      - key: SECRET_KEY
        fromService: { type: web, name: tamis-api, envVarKey: SECRET_KEY }
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false

  - type: web
    name: tamis-web
    runtime: docker
    dockerfilePath: apps/web/Dockerfile
    dockerContext: .
    plan: starter
    region: frankfurt
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://api.tamis.app
