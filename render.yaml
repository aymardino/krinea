# Render blueprint for Tamis (decisions D-17, D-21, D-23).
#
# Services: PostgreSQL, API, worker, web. Browsers only talk to `tamis-web`; it proxies
# `/api/*` to the API over Render's private network, so the deployment works on the
# default *.onrender.com address with no domain and no extra configuration.
#
# Custom domain: add it to `tamis-web` (Settings → Custom domains), then set BASE_URL on
# `tamis-api` to that https URL (optional: links already use the origin the proxy reports).
# Cheaper test setup: `plan: free` on tamis-web and tamis-api, INLINE_JOBS=1 on the API,
# and delete the worker (free instances sleep after 15 min of inactivity).
# PDFs: set S3_BUCKET / S3_ENDPOINT_URL (Cloudflare R2, Backblaze B2…) so the API needs no
# persistent disk; otherwise attach a disk to the API at /data.
databases:
  - name: tamis-db
    plan: basic-256mb
    databaseName: tamis
    user: tamis
    region: frankfurt

services:
  - type: web
    name: tamis-api
    runtime: docker
    dockerfilePath: apps/api/Dockerfile
    dockerContext: .
    plan: starter
    region: frankfurt
    healthCheckPath: /health
    envVars:
      - key: TAMIS_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase: { name: tamis-db, property: connectionString }
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: INLINE_JOBS
        value: "0"
      - key: EMAIL_PROVIDER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: Tamis <no-reply@example.org>
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: UNPAYWALL_EMAIL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

  - type: worker
    name: tamis-worker
    runtime: docker
    dockerfilePath: apps/api/Dockerfile
    dockerContext: .
    dockerCommand: python -m tamis_api.worker
    plan: starter
    region: frankfurt
    envVars:
      - key: TAMIS_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase: { name: tamis-db, property: connectionString }
      - key: SECRET_KEY
        fromService: { type: web, name: tamis-api, envVarKey: SECRET_KEY }
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false

  - type: web
    name: tamis-web
    runtime: docker
    dockerfilePath: apps/web/Dockerfile
    dockerContext: .
    plan: starter
    region: frankfurt
    envVars:
      # Internal address of the API (host:port on Render's private network). If the
      # blueprint cannot resolve it, set API_URL by hand to the API's https URL instead.
      - key: API_URL
        fromService: { type: web, name: tamis-api, property: hostport }
      - key: PROXY_KEY
        fromService: { type: web, name: tamis-api, envVarKey: SECRET_KEY }
