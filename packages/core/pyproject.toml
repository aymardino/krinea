[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "krinea-core"
version = "0.1.0"
description = "Bibliographic parsing, deduplication, screening and extraction-form logic for systematic reviews"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
# pymupdf>=1.24.3: first release that ships the `pymupdf` module name (older ones only had `fitz`)
dependencies = ["rapidfuzz>=3.9", "pandas>=2.0", "pymupdf>=1.24.3"]

[project.optional-dependencies]
excel = ["openpyxl>=3.1"]
# Provider SDKs used by krinea_core.llm (imported lazily, only when an AI call is made)
llm = ["anthropic>=0.40", "openai>=1.0", "google-generativeai>=0.8"]

[tool.setuptools.packages.find]
include = ["krinea_core*"]

# Ship the JSON templates (PRISMA 2020 texts, energy-modelling form) inside the wheel
[tool.setuptools.package-data]
krinea_core = ["data/*.json"]
