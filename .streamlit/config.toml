# Theme shared by review_app.py and the legacy extraction_app.py.
# Calm teal on white: readable for hours of screening, neutral enough to brand.

[theme]
base = "light"
primaryColor = "#0E7490"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F3F6F8"
textColor = "#1F2937"
font = "sans serif"

[server]
maxUploadSize = 500

[browser]
gatherUsageStats = false
