# Put this file at .streamlit/config.toml, next to extraction_app.py.
# It replaces Streamlit's default red identity with a calm Excel-green theme.
# Delete the file to go back to the standard light/dark auto theme.

[theme]
base = "light"
primaryColor = "#217346"
backgroundColor = "#FCFCFA"
secondaryBackgroundColor = "#F0F2EE"
textColor = "#232B26"
