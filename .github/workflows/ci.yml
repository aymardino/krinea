name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests (engine, Streamlit edition, API)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            packages/core/pyproject.toml
            apps/api/pyproject.toml

      # requirements.txt installs packages/core as a regular (non-editable) package, so the
      # tests also check that the wheel ships everything (krinea_core/data/*.json). Adding
      # "-e packages/core" here would request the same package twice and fail to resolve.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt -e "apps/api[dev]"

      - name: Root tests (krinea_core, Streamlit edition)
        run: python -m pytest -q

      - name: API tests
        working-directory: apps/api
        run: python -m pytest -q

  web:
    name: Web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # pnpm version comes from "packageManager" in apps/web/package.json
      - name: Enable pnpm (corepack)
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
